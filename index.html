<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AgriRobo – Smart Field Simulator</title>
<style>
:root{--bg:#0a120e;--pn:#0a1a2fcc;--ln:#1f3c63;--fg:#e6f0ea;--mu:#8fa89b;--ac:#35c46a;--wa:#3aa0ff;--wr:#ffb020;--er:#ff4d4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9f0ea;--pn:#fbfdfbf2;--ln:#c9d9ce;--fg:#14241b;--mu:#4f6658;--ac:#1b8a45;--wa:#1368c4;--wr:#9a5b00;--er:#c62828;color-scheme:light}}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
.mu{color:var(--mu)}button,select{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--ln);border-radius:8px;padding:5px 10px;cursor:pointer}
select{background:var(--bg);width:100%}button:hover{border-color:var(--ac)}button.g{background:var(--ac);border-color:var(--ac);color:#04140a;font-weight:700}button.r{background:var(--er);border-color:var(--er);color:#fff;font-weight:700}button.on{outline:2px solid var(--ac)}
#app{flex:1;min-height:0;position:relative}
aside{position:absolute;z-index:2;top:10px;bottom:10px;width:280px;background:var(--pn);backdrop-filter:blur(8px);overflow:auto;padding:10px;border:1px solid var(--ln);border-radius:14px}#L{left:10px}#Rt{right:10px;width:292px}
.tabs{display:flex;gap:4px;margin-bottom:6px}.tabs button{flex:1}
.sl{display:grid;grid-template-columns:1fr auto;margin:7px 0}.sl input{grid-column:1/3;width:100%;accent-color:var(--ac)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:4px 0}.tg input[type=radio]{width:18px;height:18px;accent-color:var(--ac)}.tg input[type=checkbox]{appearance:none;-webkit-appearance:none;width:48px;height:24px;border-radius:99px;background:#33445c;position:relative;cursor:pointer;transition:background .25s}.tg input[type=checkbox]::after{content:"No";position:absolute;right:8px;top:3px;font-size:12px;color:#cfe0f5}.tg input[type=checkbox]::before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .25s}.tg input[type=checkbox]:checked{background:#1d9bf0}.tg input[type=checkbox]:checked::after{content:"Yes";right:auto;left:9px;color:#fff}.tg input[type=checkbox]:checked::before{left:27px}
.cd{border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin-bottom:10px}.cd h4{margin:0 0 5px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.kv span:first-child{color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chips button{font-size:12px;padding:4px 8px}
summary{cursor:pointer;margin-bottom:4px}@keyframes in{from{opacity:0;transform:translateY(-6px)}}@keyframes pulse{50%{opacity:.3}}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;animation:pulse 1.3s infinite}.lr{display:flex;gap:8px}.lr b{color:var(--mu);font-weight:400;flex:none}.lr:before{content:"";width:7px;height:7px;border-radius:50%;background:#35c46a;margin-top:6px;flex:none}.lr.n{animation:in .5s}#cap{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;max-width:42%;top:56px;background:#0a1a2fee;border:1px solid #1d6fe0;padding:8px 16px;border-radius:12px;text-align:center;animation:in .4s;z-index:3}.tabs button{padding:5px 3px;font-size:13px}
#C{position:absolute;inset:0}#cv{position:absolute;inset:0}
#bn{position:absolute;left:302px;top:10px;padding:5px 12px;border-radius:99px;font-weight:700;color:#fff;background:#47564d}
#cm{position:absolute;right:312px;top:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;background:var(--pn);padding:5px;border-radius:10px}
#pad{position:absolute;left:302px;bottom:96px;display:grid;grid-template-columns:repeat(3,44px);gap:4px}#pad button{height:44px;background:var(--pn);font-size:18px}
#st{position:absolute;left:302px;right:312px;bottom:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.s{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:6px 9px}.s small{color:var(--mu);display:block}.s b{font-size:17px}.s i{display:block;height:4px;border-radius:3px;background:var(--ac);margin:3px 0;transition:width .5s,background .3s}
#sum{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px}[hidden]{display:none!important}#sum>div{background:var(--bg);border:1px solid var(--ac);border-radius:12px;padding:18px;max-width:430px;width:100%}
#log{font:12px/1.5 ui-monospace,Consolas,monospace;max-height:170px;overflow:auto}.ok{color:var(--ac)}.no{color:var(--mu)}
#hint{position:absolute;left:302px;top:48px;color:#fff;text-shadow:0 1px 3px #000;font-size:12px;opacity:.85}
@media(max-width:960px){body{overflow:auto;display:block}#app{position:static}#C{position:relative;height:66vh;inset:auto}#L,#Rt{position:static;width:auto;border-radius:0}#bn,#hint,#pad{left:10px}#cm{right:10px}#st{left:10px;right:10px;grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><b style="font-size:18px">🌱 AgriRobo</b><span class="mu">Smart Farming • Sustainable Future</span><span style="flex:1"></span>
<button class="g" id="bGo">▶ Start</button><button id="bPa">❚❚ Pause</button><button id="bSt">■ Stop</button><button id="bRs">↺ Reset</button><button class="r" id="bEs">⚠ E-STOP</button><button id="bDemo" style="background:#1d6fe0;border-color:#1d6fe0;color:#fff;font-weight:700">Guided Demo</button>
<span><button id="mA" class="on">Auto mission</button><button id="mM">Manual drive</button></span></header>
<div id="app"><aside id="L"><div class="tabs"><button data-t="s" class="on">Sensors</button><button data-t="d">Design lab</button><button data-t="t">Tests</button><button data-t="y">System</button></div><div id="ts"></div><div id="td" hidden></div><div id="tt" hidden></div><div id="ty" hidden></div></aside>
<section id="C"><div id="cv"></div><div id="bn">● READY</div><div id="cap" hidden></div><div id="hint">Drag to orbit • scroll to zoom</div>
<div id="cm"><button data-v="0" class="on">Follow</button><button data-v="1">Field</button><button data-v="2">Top</button><button data-v="3">Side</button><button data-sp="1" class="on">1x</button><button data-sp="2">2x</button><button data-sp="4">4x</button></div>
<div id="pad" hidden><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
<div id="st"></div><div id="sum" hidden><div id="sumt"></div></div></section>
<aside id="Rt"><div class="cd"><h4>Field map</h4><canvas id="mp" width="520" height="300" style="width:100%;border-radius:6px"></canvas><div class="kv"><span>Robot position</span><b id="px"></b></div><div class="kv"><span>Heading / row</span><b id="hd"></b></div><div class="kv"><span>Coverage</span><b id="rd"></b></div></div>
<div class="cd"><h4>Decision engine</h4><div class="kv"><span>State</span><b id="ds"></b></div><div class="kv"><span>Task</span><b id="dt"></b></div><div class="kv"><span>Last decision</span></div><div id="dw" style="color:var(--wa)"></div><div class="mu" id="dh" style="font-size:12px;margin:4px 0"></div><div class="kv"><span>Safety interlocks</span></div><div id="dl"></div></div>
<div class="cd"><h4>Event log</h4><div id="log"></div></div></aside></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pad=n=>String(n).padStart(2,"0"),rnd=Math.random;
const TF=60,NC=24,NR=6,FW=12,RZ=1.4,LOWB=15,zr=i=>(i-2.5)*RZ,BASE={x:-9.5,z:0};
const OP={panel:{n:"Solar panel",o:[["10 W (report)",500,10],["20 W",900,20],["40 W",1600,40]]},bat:{n:"Battery",o:[["12 V 7 Ah (report)",700,84],["12 V 12 Ah",1100,144]]},tank:{n:"Water tank",o:[["5 L",200,5],["10 L (report)",250,10],["20 L",350,20]]},wheel:{n:"Wheels",o:[["Small",0,.24],["Large",150,.34]]},tine:{n:"Plough",o:[["1 tine",0,1],["3 tines",180,3]]},chas:{n:"Chassis",o:[["Standard",0,0],["Lightweight alloy",450,1]]}},BC={panel:500,bat:700,tank:250};
const PRE={"Report baseline":{panel:0,bat:0,tank:1,wheel:0,tine:0,chas:0},"Smart upgrade":{panel:1,bat:0,tank:1,wheel:1,tine:0,chas:0},"Max efficiency":{panel:2,bat:1,tank:2,wheel:1,tine:0,chas:1}};
let DS={...PRE["Report baseline"]},D,S,SPD=1,prev=null,plants=[],dirty=[],keys={w:0,a:0,s:0,d:0};
function derive(){const g=k=>OP[k].o[DS[k]],lw=g("chas")[2],lg=DS.wheel;D={p:g("panel")[2],wh:g("bat")[2],cap:g("tank")[2],wr:g("wheel")[2],tn:g("tine")[2],lw,spd:1.5*(lg?1.22:1)*(lw?1.08:1),mv:22*(lw?.8:1)*(lg?.88:1),pl:6+3*g("tine")[2],cost:7965+Object.keys(OP).reduce((a,k)=>a+g(k)[1]-(BC[k]||0),0)}}
function init(){derive();const A=()=>Array.from({length:NR},()=>new Uint8Array(NC));S={run:0,done:0,es:0,t:0,x:BASE.x,z:BASE.z,th:0,v:0,m:18,T:28,H:62,tankL:D.cap*.8,bat:92,sun:.8,rain:0,obs:0,sa:1,ai:1,pe:1,se:1,dyn:S?S.dyn:1,man:S?S.man:0,vs:A(),pl:A(),sw:A(),wt:A(),seeds:0,water:0,wh:0,wp:plan(),wi:0,chg:0,need:0,thr:30,solW:0,load:0,pump:0,plow:0,over:0,mv:0,dec:{st:"READY",task:"Idle",why:"Press Start, or switch to Manual drive",lock:[],col:"#47564d"},logs:[],lv:0,lk:"",fl:S?S.fl:{}};S.fl={};plants=[];dirty=[];$("sum").hidden=1;lg("System ready. ESP32 controller online");if(FX)repaint();syncAll()}
function plan(){const w=[];for(let i=0;i<NR;i++){const a=i%2?FW/2:-FW/2;w.push({x:a,z:zr(i)},{x:-a,z:zr(i)})}w.push({x:BASE.x,z:BASE.z,end:1});return w}
const clk=()=>{const m=600+Math.floor(S.t);return pad(m/60|0)+":"+pad(m%60)};
function lg(t){S.logs.unshift("["+clk()+"] "+t);if(S.logs.length>9)S.logs.pop();S.lv++}
const fl=k=>{S.fl[k]=1};
function decide(){const s=S,tk=s.tankL/D.cap*100,thr=30+(s.T>32?5:0)+(s.H<40?5:0),L=[],run=s.man||s.run,m=s.m.toFixed(0);s.thr=thr;
if(s.es)L.push("E-STOP engaged");if(s.obs)L.push("Obstacle ahead");if(s.bat<LOWB)L.push("Battery low");if(tk<5)L.push("Tank empty");if(s.rain)L.push("Rain detected");
s.need=s.dyn?(s.need?s.m<thr+12:s.m<thr):s.m<thr;
if(s.bat<LOWB&&!s.man)s.chg=1;
let r={st:"IDLE",task:"Standing by",why:"Press Start, or switch to Manual drive",k:"idle",go:1,irr:0,lock:L,col:"#47564d"};
if(s.done)r={...r,st:"COMPLETE",task:"Parked at base",why:"Mission complete",k:"done",go:0,col:"#1f9d55"};
else if(s.es){fl("es");r={...r,st:"E-STOP",task:"Motors cut",why:"Emergency stop engaged. Release to continue",k:"es",go:0,col:"#d32f2f"}}
else if(s.obs){fl("ob");r={...r,st:"OBSTACLE",task:"Waiting",why:"Distance sensor blocked. Robot stopped until the path is clear",k:"ob",go:0,col:"#c98a00"}}
else if(s.chg&&!s.man){fl("bt");const at=Math.hypot(s.x-BASE.x,s.z-BASE.z)<.4;r={...r,st:at?"CHARGING":"TO BASE",task:"Solar recharge",why:"Battery "+s.bat.toFixed(0)+"% is below "+LOWB+"%. Recharging until 45%",k:"chg",go:1,col:"#c98a00"}}
else if(run){r={...r,st:"WORKING",task:"Field work",col:"#1f9d55"};
if(!s.ai){r.why="Auto irrigation is switched off";r.k="aioff"}
else if(!s.need){fl("dry_ok");r.why="Moisture "+m+"% is above the "+thr+"% limit. No irrigation needed";r.k="dryok"}
else if(s.rain){fl("rain");r.why="Soil is dry ("+m+"%) but rain is falling. Irrigation skipped";r.k="rain"}
else if(tk<5){fl("tank");r.why="Soil is dry ("+m+"%) but the tank is empty. Cannot irrigate";r.k="tank"}
else{r.irr=1;r.k="pump";r.why="Soil moisture "+m+"% < "+thr+"%. Start irrigation";r.task="Irrigation";if(s.pump){r.st="IRRIGATING";fl("pump")}}}
return r}
function steer(tx,tz,dt){const dx=tx-S.x,dz=tz-S.z,d=Math.hypot(dx,dz);let e=Math.atan2(dz,dx)-S.th;e=Math.atan2(Math.sin(e),Math.cos(e));S.th+=clamp(e*3,-1,1)*3.2*dt;S.v=Math.abs(e)<.5?D.spd*(S.eco?.7:1)*Math.min(1,d/.7+.2)*Math.cos(e):0;return d}
function upd(dt0){const s=S,dt=dt0*SPD,dec=decide(),k=keys;s.dec=dec;const act=!s.es&&!s.done&&(s.man||s.run);
if(dec.k!==s.lk){s.lk=dec.k;if(dec.k!="idle")lg(dec.why)}
if(act)s.t+=dt;
if(act&&dec.go){if(s.man){s.th+=(k.d-k.a)*2.2*dt;s.v+=((k.w-k.s)*D.spd*(s.eco?.7:1)-s.v)*Math.min(1,dt*5)}
else{const w=s.wp[s.wi],tg=s.chg?BASE:w,d=steer(tg.x,tg.z,dt);if(d<.2){if(s.chg){s.v=0;if(s.bat>=45){s.chg=0;lg("Battery "+s.bat.toFixed(0)+"%. Resuming mission")}}else if(w.end){s.done=1;s.v=0;lg("Mission complete");finish()}else s.wi++}}}
else s.v+=(0-s.v)*Math.min(1,dt*8);
s.x=clamp(s.x+Math.cos(s.th)*s.v*dt,-14,14);s.z=clamp(s.z+Math.sin(s.th)*s.v*dt,-9,9);
const ri=Math.round(s.z/RZ+2.5),kc=Math.floor((s.x+FW/2)/(FW/NC));s.over=ri>=0&&ri<NR&&Math.abs(s.z-zr(ri))<.55&&kc>=0&&kc<NC;s.mv=Math.abs(s.v)>.05;
let plow=0,sow=0,pump=0;
if(act&&dec.go&&s.mv&&s.over){s.vs[ri][kc]=1;
if(s.pe){plow=1;if(!s.pl[ri][kc]){s.pl[ri][kc]=1;dirty.push([ri,kc])}}
if(s.se&&s.sa&&!s.sw[ri][kc]){s.sw[ri][kc]=1;s.seeds++;sow=1;addPlants(ri,kc)}
if(dec.irr){pump=1;if(!s.wt[ri][kc]){s.wt[ri][kc]=1;dirty.push([ri,kc])}}}
s.plow=plow;s.pump=pump;
if(pump){s.water+=dt;if(s.dyn)s.tankL=Math.max(0,s.tankL-dt)}
if(s.dyn)s.m=clamp(s.m+(s.rain?1.2:0)*dt-(.02+Math.max(0,s.T-25)*.006)*dt+(pump?2.4*dt:0),0,100);
const sol=D.p*s.sun*(s.rain?.4:1)*.85,load=4+(s.mv?D.mv*(s.eco?.6:1):0)+(plow?D.pl:0)+(sow?3:0)+(pump?9:0),at=s.chg&&Math.hypot(s.x-BASE.x,s.z-BASE.z)<.4,tf=at?30:1;
s.solW=sol;s.load=load;s.wh+=load*dt*TF/3600;
if(s.dyn)s.bat=clamp(s.bat+(sol-load)*dt*TF*tf/3600/D.wh*100,0,100);}
function finish(){const s=S,rows=s.vs.filter(r=>r.every(x=>x)).length,c={wh:s.wh,water:s.water,t:s.t,bat:s.bat,seeds:s.seeds};
const dl=(a,b,u)=>prev?" <span class='"+(a<=b?"ok":"no")+"'>("+(a<=b?"▼ ":"▲ ")+Math.abs(a-b).toFixed(1)+u+" vs last run)</span>":"";
$("sumt").innerHTML="<h3 style='margin:0 0 8px'>Mission complete</h3><div class='kv'><span>Rows finished</span><b>"+rows+" / "+NR+"</b></div><div class='kv'><span>Seeds sown</span><b>"+s.seeds+"</b></div><div class='kv'><span>Water used</span><b>"+s.water.toFixed(1)+" L"+(prev?dl(c.water,prev.water," L"):"")+"</b></div><div class='kv'><span>Energy used</span><b>"+s.wh.toFixed(1)+" Wh"+(prev?dl(c.wh,prev.wh," Wh"):"")+"</b></div><div class='kv'><span>Mission time</span><b>"+Math.round(s.t)+" min"+(prev?dl(c.t,prev.t," min"):"")+"</b></div><div class='kv'><span>Battery at end</span><b>"+s.bat.toFixed(0)+"%</b></div><div class='kv'><span>Build cost</span><b>₹"+D.cost.toLocaleString("en-IN")+"</b></div><p class='mu'>Change the design in the Design lab, reset, and run again to compare.</p><button class='g' onclick='prev=" +"null;init()'>Run again</button>";
$("sumt").querySelector("button").onclick=()=>{prev=c;init()};$("sum").hidden=0}
/* ---------- UI ---------- */
const IC={m:"💧",T:"🌡️",H:"☁️",tk:"🛢️",bat:"🔋",sun:"☀️"},SL=[["m","Soil moisture","%",0,100],["T","Temperature","°C",0,50],["H","Humidity","%",0,100],["tk","Tank level","%",0,100],["bat","Battery","%",0,100],["sun","Sunlight","%",0,100]],TG=[["rain","Rain detected"],["obs","Obstacle detected"],["sa","Seeds available"],["ai","Auto irrigation"],["pe","Plough enabled"],["se","Sowing enabled"],["eco","Eco mode (slower, saves energy)"]],
SC={"Dry day":{m:15,rain:0,T:30},"Rain":{m:15,rain:1},"Low battery":{bat:17},"Empty tank":{tk:3,m:15},"Heatwave":{T:40,H:25,m:33},"Wet soil":{m:70}};
$("ts").innerHTML='<div class="cd"><h4>Sensor inputs</h4>'+SL.map(a=>'<div class="sl"><span>'+IC[a[0]]+" "+a[1]+'</span><b id="v_'+a[0]+'"></b><input type="range" id="i_'+a[0]+'" min="'+a[3]+'" max="'+a[4]+'" step="1"></div>').join("")+'<div class="kv"><span>Solar input</span><b id="sw"></b></div></div><div class="cd">'+TG.map(a=>'<label class="tg"><span>'+a[1]+'</span><input type="checkbox" id="t_'+a[0]+'"></label>').join("")+'</div><div class="cd"><h4>Sensor mode</h4><label class="tg"><span>Manual input (values stay fixed)</span><input type="radio" name="sm" id="sm0" checked></label><label class="tg"><span>Dynamic simulation (values evolve)</span><input type="radio" name="sm" id="sm1"></label></div><div class="cd"><h4>Quick scenarios</h4><div class="chips">'+Object.keys(SC).map(k=>'<button data-sc="'+k+'">'+k+'</button>').join("")+'</div></div>';
$("td").innerHTML='<div class="cd"><h4>Presets</h4><div class="chips">'+Object.keys(PRE).map(k=>'<button data-pr="'+k+'">'+k+'</button>').join("")+'</div></div><div class="cd"><h4>Robot parts</h4>'+Object.keys(OP).map(k=>'<div class="sl"><span>'+OP[k].n+'</span><span></span><select id="d_'+k+'" style="grid-column:1/3">'+OP[k].o.map((o,i)=>'<option value="'+i+'">'+o[0]+(o[1]?" – ₹"+o[1]:"")+'</option>').join("")+'</select></div>').join("")+'</div><div class="cd"><h4>Design scorecard</h4><div id="spec"></div></div><p class="mu" style="font-size:12px">Change a part, press Reset, then run the same scenario and compare energy, water and time in the mission summary.</p>';
const TS=[["pump","Dry soil turns the pump ON"],["dry_ok","Moist soil keeps the pump OFF"],["rain","Rain blocks irrigation"],["tank","Empty tank blocks irrigation"],["bt","Low battery sends robot to charge"],["ob","Obstacle stops the robot"],["es","E-STOP cuts the motors"]];
$("tt").innerHTML='<div class="cd"><h4>How to test the robot</h4><ol style="margin:0;padding-left:18px"><li>Press Start (or use Manual drive with W A S D).</li><li>In Sensors, move a slider or press a quick scenario.</li><li>Watch the Decision engine explain what it does.</li><li>Tick every test below.</li></ol></div><div class="cd"><h4>Checklist <span id="tp" class="mu"></span></h4>'+TS.map(a=>'<div class="kv no" id="q_'+a[0]+'"><span>'+a[1]+'</span><b>○</b></div>').join("")+'</div>';
$("st").innerHTML=["💧 Moisture","🛢️ Tank","🔋 Battery","⚙️ Pump","🚜 Plough","🌱 Seeds"].map((n,i)=>'<div class="s"><small>'+n+'</small><b id="c'+i+'"></b><i id="b'+i+'"></i><small id="e'+i+'"></small></div>').join("");
